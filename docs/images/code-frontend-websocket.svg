<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1550" viewBox="0 0 1110 1550">
  <rect width="100%" height="100%" fill="#f2f4f8"/>
  <rect x="20" y="20" width="1070" height="1510" rx="12" fill="#101827" stroke="#263247"/>
  <rect x="20" y="20" width="1070" height="44" rx="12" fill="#172235"/>
  <circle cx="42" cy="42" r="6" fill="#ff5f57"/><circle cx="62" cy="42" r="6" fill="#febc2e"/><circle cx="82" cy="42" r="6" fill="#28c840"/>
  <text x="104" y="47" fill="#e9eef8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Frontend WebSocket connection and event handling</text>
  <text x="1076" y="47" fill="#92a2ba" font-family="Arial, sans-serif" font-size="14" text-anchor="end">NearByChat-Main/script.js:58-115</text>
  <text x="34" y="92" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 58  function send(data) {</text>
  <text x="34" y="117" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 59    if (socket &amp;&amp; socket.readyState === WebSocket.OPEN) {</text>
  <text x="34" y="142" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 60      socket.send(JSON.stringify(data));</text>
  <text x="34" y="167" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 61    }</text>
  <text x="34" y="192" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 62  }</text>
  <text x="34" y="217" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 63  </text>
  <text x="34" y="242" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 64  function connect() {</text>
  <text x="34" y="267" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 65    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/chat";</text>
  <text x="34" y="292" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 66    socket = new WebSocket(url);</text>
  <text x="34" y="317" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 67    scanText.textContent = "Connecting...";</text>
  <text x="34" y="342" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 68  </text>
  <text x="34" y="367" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 69    socket.addEventListener("open", () =&gt; {</text>
  <text x="34" y="392" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 70      send({</text>
  <text x="34" y="417" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 71        type: "hello",</text>
  <text x="34" y="442" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 72        id: clientId,</text>
  <text x="34" y="467" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 73        alias: userName,</text>
  <text x="34" y="492" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 74      });</text>
  <text x="34" y="517" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 75    });</text>
  <text x="34" y="542" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 76  </text>
  <text x="34" y="567" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 77    socket.addEventListener("message", (event) =&gt; {</text>
  <text x="34" y="592" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 78      const data = JSON.parse(event.data);</text>
  <text x="34" y="617" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 79  </text>
  <text x="34" y="642" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 80      if (data.type === "me") {</text>
  <text x="34" y="667" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 81        userName = data.me.alias;</text>
  <text x="34" y="692" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 82        sessionStorage.setItem("nearbychatUserName", userName);</text>
  <text x="34" y="717" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 83        showUsers(data.users);</text>
  <text x="34" y="742" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 84      }</text>
  <text x="34" y="767" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 85  </text>
  <text x="34" y="792" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 86      if (data.type === "users") {</text>
  <text x="34" y="817" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 87        showUsers(data.users);</text>
  <text x="34" y="842" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 88      }</text>
  <text x="34" y="867" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 89  </text>
  <text x="34" y="892" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 90      if (data.type === "message") {</text>
  <text x="34" y="917" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 91        chatMessages.push(data.message);</text>
  <text x="34" y="942" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 92        showMessages(chatMessages);</text>
  <text x="34" y="967" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 93      }</text>
  <text x="34" y="992" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 94  </text>
  <text x="34" y="1017" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 95      if (data.type === "clear") {</text>
  <text x="34" y="1042" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 96        chatMessages = [];</text>
  <text x="34" y="1067" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 97        imageList = [];</text>
  <text x="34" y="1092" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 98        lastMessageCount = 0;</text>
  <text x="34" y="1117" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 99        showImagePreview();</text>
  <text x="34" y="1142" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">100        showMessages(chatMessages);</text>
  <text x="34" y="1167" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">101      }</text>
  <text x="34" y="1192" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">102    });</text>
  <text x="34" y="1217" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">103  </text>
  <text x="34" y="1242" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">104    socket.addEventListener("close", () =&gt; {</text>
  <text x="34" y="1267" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">105      userList.innerHTML = "";</text>
  <text x="34" y="1292" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">106      scanText.textContent = "Disconnected";</text>
  <text x="34" y="1317" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">107      setTimeout(connect, 1500);</text>
  <text x="34" y="1342" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">108    });</text>
  <text x="34" y="1367" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">109  }</text>
  <text x="34" y="1392" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">110  </text>
  <text x="34" y="1417" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">111  fileButton.innerHTML = icon("image");</text>
  <text x="34" y="1442" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">112  sendButton.innerHTML = icon("send");</text>
  <text x="34" y="1467" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">113  clearButton.innerHTML = icon("trash-2");</text>
  <text x="34" y="1492" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">114  refreshIcons();</text>
  <text x="34" y="1517" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">115  connect();</text>
</svg>