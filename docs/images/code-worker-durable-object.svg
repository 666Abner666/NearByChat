  <circle cx="42" cy="42" r="6" fill="#ff5f57"/><circle cx="62" cy="42" r="6" fill="#febc2e"/><circle cx="82" cy="42" r="6" fill="#28c840"/>
  <text x="104" y="47" fill="#e9eef8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Worker route and Durable Object room</text>
  <text x="1266" y="47" fill="#92a2ba" font-family="Arial, sans-serif" font-size="14" text-anchor="end">src/worker.js:1-101</text>
  <text x="34" y="92" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  1  export default {</text>
  <text x="34" y="117" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  2    async fetch(request, env) {</text>
  <text x="34" y="142" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  3      const url = new URL(request.url);</text>
  <text x="34" y="167" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  4  </text>
  <text x="34" y="192" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  5      if (url.pathname === "/api/chat") {</text>
  <text x="34" y="217" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  6        const roomName = getRoomName(request);</text>
  <text x="34" y="242" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  7        const id = env.CHAT_ROOM.idFromName(roomName);</text>
  <text x="34" y="267" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  8        const room = env.CHAT_ROOM.get(id);</text>
  <text x="34" y="292" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">  9        return room.fetch(request);</text>
  <text x="34" y="317" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 10      }</text>
  <text x="34" y="342" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 11  </text>
  <text x="34" y="367" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 12      return env.ASSETS.fetch(request);</text>
  <text x="34" y="392" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 13    },</text>
  <text x="34" y="417" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 14  };</text>
  <text x="34" y="442" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 15  </text>
  <text x="34" y="467" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 16  function getRoomName(request) {</text>
  <text x="34" y="492" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 17    const forwarded = request.headers.get("x-forwarded-for");</text>
  <text x="34" y="517" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 18    const ip = request.headers.get("CF-Connecting-IP") || (forwarded ? forwarded.split(",")[0].trim() : "") || "local";</text>
  <text x="34" y="542" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 19  </text>
  <text x="34" y="567" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 20    if (!ip.includes(":")) return ip;</text>
  <text x="34" y="592" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 21    return ip.split(":").filter(Boolean).slice(0, 4).join(":") || ip;</text>
  <text x="34" y="617" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 22  }</text>
  <text x="34" y="642" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 23  </text>
  <text x="34" y="667" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 24  export class ChatRoom {</text>
  <text x="34" y="692" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 25    constructor() {</text>
  <text x="34" y="717" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 26      this.people = [];</text>
  <text x="34" y="742" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 27    }</text>
  <text x="34" y="767" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 28  </text>
  <text x="34" y="792" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 29    async fetch(request) {</text>
  <text x="34" y="817" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 30      if (request.headers.get("Upgrade") !== "websocket") {</text>
  <text x="34" y="842" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 31        return new Response("WebSocket only", { status: 400 });</text>
  <text x="34" y="867" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 32      }</text>
  <text x="34" y="892" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 33  </text>
  <text x="34" y="917" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 34      const pair = new WebSocketPair();</text>
  <text x="34" y="942" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 35      const client = pair[0];</text>
  <text x="34" y="967" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 36      const socket = pair[1];</text>
  <text x="34" y="992" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 37      const person = {</text>
  <text x="34" y="1017" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 38        id: "",</text>
  <text x="34" y="1042" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 39        alias: "",</text>
  <text x="34" y="1067" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 40        socket,</text>
  <text x="34" y="1092" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 41      };</text>
  <text x="34" y="1117" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 42  </text>
  <text x="34" y="1142" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 43      socket.accept();</text>
  <text x="34" y="1167" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 44      this.people.push(person);</text>
  <text x="34" y="1192" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 45  </text>
  <text x="34" y="1217" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 46      socket.addEventListener("message", (event) =&gt; {</text>
  <text x="34" y="1242" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 47        this.handle(person, event.data);</text>
  <text x="34" y="1267" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 48      });</text>
  <text x="34" y="1292" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 49  </text>
  <text x="34" y="1317" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 50      socket.addEventListener("close", () =&gt; {</text>
  <text x="34" y="1342" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 51        this.remove(person);</text>
  <text x="34" y="1367" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 52      });</text>
  <text x="34" y="1392" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 53  </text>
  <text x="34" y="1417" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 54      socket.addEventListener("error", () =&gt; {</text>
  <text x="34" y="1442" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 55        this.remove(person);</text>
  <text x="34" y="1467" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 56      });</text>
  <text x="34" y="1492" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 57  </text>
  <text x="34" y="1517" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 58      return new Response(null, {</text>
  <text x="34" y="1542" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 59        status: 101,</text>
  <text x="34" y="1567" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 60        webSocket: client,</text>
  <text x="34" y="1592" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 61      });</text>
  <text x="34" y="1617" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 62    }</text>
  <text x="34" y="1642" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 63  </text>
  <text x="34" y="1667" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 64    handle(person, text) {</text>
  <text x="34" y="1692" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 65      let data;</text>
  <text x="34" y="1717" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 66  </text>
  <text x="34" y="1742" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 67      try {</text>
  <text x="34" y="1767" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 68        data = JSON.parse(text);</text>
  <text x="34" y="1792" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 69      } catch (error) {</text>
  <text x="34" y="1817" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 70        return;</text>
  <text x="34" y="1842" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 71      }</text>
  <text x="34" y="1867" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 72  </text>
  <text x="34" y="1892" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 73      if (data.type === "hello") {</text>
  <text x="34" y="1917" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 74        person.id = data.id;</text>
  <text x="34" y="1942" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 75        person.alias = this.makeName(data.alias, data.id);</text>
  <text x="34" y="1967" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 76        this.sendOne(person, { type: "me", me: this.publicUser(person), users: this.users() });</text>
  <text x="34" y="1992" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 77        this.broadcast({ type: "users", users: this.users() });</text>
  <text x="34" y="2017" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 78      }</text>
  <text x="34" y="2042" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 79  </text>
  <text x="34" y="2067" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 80      if (data.type === "name") {</text>
  <text x="34" y="2092" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 81        person.alias = this.makeName(data.alias, person.id);</text>
  <text x="34" y="2117" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 82        this.sendOne(person, { type: "me", me: this.publicUser(person), users: this.users() });</text>
  <text x="34" y="2142" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 83        this.broadcast({ type: "users", users: this.users() });</text>
  <text x="34" y="2167" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 84      }</text>
  <text x="34" y="2192" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 85  </text>
  <text x="34" y="2217" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 86      if (data.type === "message") {</text>
  <text x="34" y="2242" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 87        this.broadcast({</text>
  <text x="34" y="2267" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 88          type: "message",</text>
  <text x="34" y="2292" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 89          message: {</text>
  <text x="34" y="2317" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 90            senderId: person.id,</text>
  <text x="34" y="2342" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 91            sender: person.alias,</text>
  <text x="34" y="2367" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 92            type: data.message?.type || "text",</text>
  <text x="34" y="2392" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 93            text: data.message?.text || "",</text>
  <text x="34" y="2417" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 94            image: data.message?.image || "",</text>
  <text x="34" y="2442" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 95          },</text>
  <text x="34" y="2467" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 96        });</text>
  <text x="34" y="2492" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 97      }</text>
  <text x="34" y="2517" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 98  </text>
  <text x="34" y="2542" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17"> 99      if (data.type === "clear") {</text>
  <text x="34" y="2567" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">100        this.broadcast({ type: "clear" });</text>
  <text x="34" y="2592" fill="#d8e2f3" font-family="Menlo, Consolas, Monaco, monospace" font-size="17">101      }</text>
