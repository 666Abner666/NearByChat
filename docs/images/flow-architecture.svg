<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <rect x="0" y="0" width="1280" height="620" fill="#f6f8fb"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2f7cf6"/></marker></defs>
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#172033">NearByChat Architecture</text>
  <rect x="60" y="130" width="240" height="130" rx="10" fill="#ffffff" stroke="#24324a" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Browser UI</text>
  <text x="180" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">index.html, style.css</text><text x="180" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">script.js opens WebSocket</text>
  <rect x="400" y="130" width="260" height="130" rx="10" fill="#eef5ff" stroke="#24324a" stroke-width="2"/>
  <text x="530" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Cloudflare Worker</text>
  <text x="530" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">src/worker.js</text><text x="530" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">Routes /api/chat or assets</text>
  <rect x="780" y="130" width="260" height="130" rx="10" fill="#f0fff4" stroke="#24324a" stroke-width="2"/>
  <text x="910" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Durable Object</text>
  <text x="910" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">CHAT_ROOM binding</text><text x="910" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">One room per IP group</text>
  <rect x="400" y="380" width="260" height="120" rx="10" fill="#fff8e8" stroke="#24324a" stroke-width="2"/>
  <text x="530" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Static Assets</text>
  <text x="530" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">NearByChat-Main/</text><text x="530" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">served by env.ASSETS</text>
  <rect x="780" y="380" width="260" height="120" rx="10" fill="#fff0f0" stroke="#24324a" stroke-width="2"/>
  <text x="910" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">wrangler.jsonc</text>
  <text x="910" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">route chat.abnerc.com/*</text><text x="910" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#40506a">assets + DO migration</text>
  <line x1="300" y1="195" x2="400" y2="195" stroke="#2f7cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f5fc4">HTTPS / WSS</text><line x1="660" y1="195" x2="780" y2="195" stroke="#2f7cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f5fc4">get room</text><line x1="400" y1="260" x2="510" y2="380" stroke="#2f7cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="455" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f5fc4">HTML/CSS/JS</text><line x1="910" y1="380" x2="910" y2="260" stroke="#2f7cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="910" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f5fc4">configures</text>
  <text x="640" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#40506a">The page is static, but chat is real-time because messages stay on the WebSocket path.</text>
</svg>